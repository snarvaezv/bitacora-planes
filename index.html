    --shadow: 0 8px 24px rgba(60, 10, 10, 0.12);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink-text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100vh;
  }

  #app {
    max-width: 560px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding-bottom: 84px;
    position: relative;
    text-align: center;
  }

  /* ---------- HEADER ---------- */
  header.top {
    padding: 28px 20px 18px;
    border-bottom: 1px solid var(--ink-line);
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--coral);
    margin: 0 0 6px;
  }

  h1.title {
    font-family: 'Comic Neue', 'Comic Sans MS', cursive;
    font-weight: 800;
    font-size: 24px;
    line-height: 1.1;
    margin: 0 0 12px;
    display: inline-block;
    background: var(--ink);
    color: #FFFFFF;
    padding: 12px 26px;
    border-radius: 999px;
    box-shadow: var(--shadow);
  }

  .subtitle {
    font-size: 13.5px;
    color: var(--text-soft);
    margin: 0 0 18px;
  }

  .stat-row {
    display: flex;
    gap: 10px;
  }

  .stat-pill {
    flex: 1;
    background: var(--ink);
    border: 1px solid var(--ink-line);
    border-radius: 12px;
    padding: 10px 12px;
  }

  .stat-pill .num {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--gold-soft);
    display: block;
    line-height: 1;
  }

  .stat-pill .lbl {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    display: block;
    margin-top: 4px;
  }

  /* ---------- MARCADOR (tarjeta fija) ---------- */
  .score-pill {
    width: 100%;
    margin-top: 10px;
    background: var(--ink);
    border: none;
    border-radius: 14px;
    padding: 12px 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    -webkit-touch-callout: none;
    user-select: none;
    touch-action: manipulation;
  }
  .score-pill .sp-avatar {
    width: 26px; height: 26px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
    display: inline-block;
    background: #F8B4B2;
  }
  .score-pill .sp-avatar img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .score-pill .sp-name {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #FFFFFF;
  }
  .score-pill .sp-num {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 22px;
    color: #FFFFFF;
  }
  .score-pill .sp-vs {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--gold-soft);
    padding: 0 2px;
  }

  /* ---------- MARCADOR (modal) ---------- */
  .score-board {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 10px 0 18px;
  }
  .score-side { text-align: center; flex: 1; }
  .score-side .sb-avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    overflow: hidden;
    display: inline-block;
    margin: 0 auto 8px;
    background: #F8B4B2;
  }
  .score-side .sb-avatar img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .score-side .sb-name {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-soft);
    margin-bottom: 2px;
  }
  .score-side .sb-num {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 34px;
    color: var(--coral);
  }
  .score-vs {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-soft);
  }

  .score-add-row {
    display: flex;
    gap: 10px;
    margin-bottom: 8px;
  }

  .juego-picker { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }

  .score-history {
    margin-top: 6px;
    max-height: 220px;
    overflow-y: auto;
    border-top: 1px solid #F3D9D6;
  }
  .score-history-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 2px;
    border-bottom: 1px solid #F3D9D6;
    font-size: 12.5px;
  }
  .score-history-row .sh-winner {
    font-weight: 700;
    color: var(--coral);
    min-width: 44px;
  }
  .score-history-row .sh-game {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    text-transform: uppercase;
    color: var(--text-soft);
    background: var(--paper-dim);
    padding: 2px 7px;
    border-radius: 5px;
  }
  .score-history-row .sh-place { flex: 1; color: #6b6250; }
  .score-history-row .sh-del {
    background: none; border: none; color: var(--text-soft);
    font-size: 16px; cursor: pointer; padding: 4px 6px;
  }
  .score-empty { text-align: center; color: var(--text-soft); font-size: 13px; padding: 16px 0; }

  /* ---------- HEADER ILLUSTRATION ---------- */
  .header-illustration {
    position: relative;
    height: 108px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 2px;
    margin-bottom: 6px;
  }
  .leaf-bg {
    position: absolute;
    top: -18px; left: 50%;
    transform: translateX(-50%);
    width: 220px;
    opacity: 0.5;
  }
  .avatar-hero {
    width: 66px;
    height: auto;
    position: relative;
    z-index: 1;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.35));
  }
  .avatar-hero-left { margin-right: -6px; }
  .avatar-hero-right { margin-left: -6px; }

  .avatar-badge {
    width: 22px; height: 22px;
    border-radius: 50%;
    overflow: hidden;
    background: #F8B4B2;
    flex-shrink: 0;
    display: inline-block;
  }
  .avatar-badge svg, .avatar-badge img { width: 100%; height: 100%; display: block; object-fit: cover; }

  .who-avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    overflow: hidden;
    background: #EAC79A;
    display: inline-block;
    vertical-align: middle;
    margin-right: 6px;
  }
  .who-avatar svg, .who-avatar img { width: 100%; height: 100%; object-fit: cover; }

  /* ---------- SURPRISE BUTTON ---------- */
  .surprise-btn {
    margin: 16px 20px 0;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px dashed var(--gold);
    background: rgba(245,150,146,0.12);
    color: var(--coral);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    letter-spacing: 0.03em;
    cursor: pointer;
    text-align: center;
  }
  .surprise-btn:active { background: rgba(245,150,146,0.22); }

  /* ---------- ANIMACIÓN DE LA RULETA ---------- */
  .surprise-loading {
    padding: 26px 10px 10px;
    text-align: center;
  }
  .surprise-spinner {
    font-size: 26px;
    letter-spacing: 10px;
    color: var(--gold);
    margin-bottom: 10px;
  }
  .surprise-spinner span {
    display: inline-block;
    animation: sparkle-spin 1.1s ease-in-out infinite;
  }
  .surprise-spinner span:nth-child(2) { animation-delay: .12s; }
  .surprise-spinner span:nth-child(3) { animation-delay: .24s; }
  .surprise-spinner span:nth-child(4) { animation-delay: .36s; }
  @keyframes sparkle-spin {
    0%, 100% { transform: scale(0.75) rotate(0deg); opacity: .45; }
    50% { transform: scale(1.25) rotate(180deg); opacity: 1; }
  }
  .surprise-spin-title {
    font-family: 'Fraunces', serif;
    font-size: 19px;
    font-weight: 600;
    color: var(--ink-text);
    min-height: 28px;
    margin: 6px 0 24px;
    animation: spin-flicker .13s linear infinite alternate;
  }
  @keyframes spin-flicker {
    from { opacity: .5; }
    to { opacity: 1; }
  }

  /* ---------- TABS ---------- */
  .tabs {
    display: flex;
    flex-wrap: wrap;
    row-gap: 4px;
    gap: 4px;
    padding: 14px 20px 0;
  }

  .tab-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    background: none;
    border: none;
    color: var(--text-soft);
    padding: 12px 8px 14px;
    min-height: 44px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-right: 6px;
    transition: color .15s ease, border-color .15s ease;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }

  .tab-btn.active {
    color: var(--coral);
    border-bottom-color: var(--gold);
  }

  .filter-chips {
    display: flex;
    gap: 8px;
    padding: 12px 20px 4px;
    flex-wrap: wrap;
  }

  .chip {
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 999px;
    background: var(--ink);
    border: 1px solid var(--ink);
    color: #FFFFFF;
    cursor: pointer;
  }

  .chip.active {
    background: var(--paper);
    border-color: var(--ink);
    color: var(--ink);
    font-weight: 600;
  }

  /* ---------- CONTENT ---------- */
  main#content {
    flex: 1;
    padding: 16px 20px 20px;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-soft);
  }

  .empty-state .eyebrow { color: var(--text-soft); }

  .empty-state p.big {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    color: var(--coral);
    margin: 6px 0 6px;
  }

  /* ---------- PLAN CARD (paper look) ---------- */
  .card {
    background: var(--paper);
    color: var(--ink-text);
    border-radius: var(--radius);
    padding: 16px 16px 14px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    position: relative;
    cursor: pointer;
    border: 1px solid rgba(0,0,0,0.04);
    overflow: hidden;
  }

  .card::before {
    content: "";
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 4px;
    background: var(--cat-color, var(--sage));
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }

  .card h3 {
    font-family: 'Fraunces', serif;
    font-size: 17.5px;
    font-weight: 600;
    margin: 0 0 4px;
    line-height: 1.25;
  }

  .card .desc {
    font-size: 13px;
    color: #6b6250;
    margin: 0 0 10px;
    line-height: 1.4;
  }

  .card-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .cat-tag {
    font-size: 10.5px;
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 5px;
    background: var(--cat-color, var(--sage));
    color: #fff;
    white-space: nowrap;
  }

  .meta-date {
    font-size: 11.5px;
    font-family: 'IBM Plex Mono', monospace;
    color: #8a8168;
  }

  .hearts {
    margin-left: auto;
    display: flex;
    gap: 2px;
  }

  .heart {
    width: 12px; height: 12px;
    display: inline-block;
  }

  .status-badge {
    font-size: 10px;
    font-family: 'IBM Plex Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 3px 7px;
    border-radius: 5px;
    border: 1px solid currentColor;
  }
  .status-idea { color: var(--muted-status, #8a93b3); }
  .status-programado { color: var(--coral); }

  .stamp-wrap {
    position: absolute;
    top: 10px;
    right: 12px;
    transform: rotate(-9deg);
  }

  .card-photo {
    width: calc(100% + 32px);
    margin: -16px -16px 12px;
    height: 150px;
    background-size: cover;
    background-position: center;
    border-radius: var(--radius) var(--radius) 0 0;
  }

  .detail-photo {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 12px;
    margin-bottom: 14px;
    display: block;
  }

  .photo-input-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 8px;
  }
  .photo-input-wrap label.upload-btn {
    font-size: 12.5px;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid #ddd3b8;
    background: #fffdf8;
    cursor: pointer;
  }
  #foto-preview-img {
    width: 44px; height: 44px;
    border-radius: 8px;
    object-fit: cover;
    display: none;
  }

  .rating-dots { display: flex; gap: 3px; margin-top: 8px; }
  .rating-dots .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #F8B4B2;
  }
  .rating-dots .dot.filled { background: var(--coral); }

  /* ---------- CALENDARIO ---------- */
  .cal-card {
    background: var(--paper);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow);
  }

  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .cal-nav-btn {
    background: none;
    border: none;
    font-size: 20px;
    line-height: 1;
    color: var(--coral);
    cursor: pointer;
    padding: 8px 12px;
    min-height: 40px;
    -webkit-touch-callout: none;
    user-select: none;
    touch-action: manipulation;
  }

  .cal-month-label {
    font-family: 'Fraunces', serif;
    font-size: 16px;
    color: var(--ink-text);
    text-transform: capitalize;
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }

  .cal-weekday {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    color: var(--text-soft);
    text-align: center;
    padding-bottom: 6px;
  }

  .cal-day {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    border-radius: 10px;
    background: #FFFDFB;
    border: 1px solid rgba(0,0,0,0.04);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    color: var(--ink-text);
    -webkit-touch-callout: none;
    user-select: none;
    touch-action: manipulation;
  }
  .cal-day.empty { visibility: hidden; cursor: default; }
  .cal-day.today { border: 2px solid var(--coral); font-weight: 700; }
  .cal-day.has-plans { background: var(--paper-dim); }

  .cal-dots { display: flex; gap: 2px; height: 5px; }
  .cal-dot { width: 5px; height: 5px; border-radius: 50%; }

  .day-plan-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 2px;
    border-bottom: 1px solid #F3D9D6;
    cursor: pointer;
    text-align: left;
  }
  .day-plan-row:last-of-type { border-bottom: none; }
  .day-plan-title { flex: 1; font-size: 13.5px; text-align: left; }

  /* ---------- RANKING ---------- */
  .rank-row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--paper);
    color: var(--ink-text);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
    cursor: pointer;
  }

  .rank-num {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    color: var(--gold);
    width: 26px;
    flex-shrink: 0;
  }

  .rank-info { flex: 1; min-width: 0; }
  .rank-info h4 { margin: 0 0 2px; font-family: 'Fraunces', serif; font-size: 15.5px; }
  .rank-info .cat-tag { margin-top: 2px; }

  /* ---------- FAB ---------- */
  .fab {
    position: fixed;
    bottom: 96px;
    left: 50%;
    transform: translateX(159px);
    width: 54px; height: 54px;
    border-radius: 50%;
    background: var(--gold);
    color: var(--ink);
    border: none;
    font-size: 26px;
    line-height: 1;
    box-shadow: 0 6px 18px rgba(201,154,62,0.4);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    z-index: 20;
  }
  @media (max-width: 599px) {
    .fab { right: 20px; left: auto; transform: none; }
  }

  /* ---------- BOTTOM NAV ---------- */
  nav.bottom {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--ink);
    border-top: 1px solid var(--ink-line);
    display: flex;
    max-width: 560px;
    margin: 0 auto;
    z-index: 15;
    padding-bottom: env(safe-area-inset-bottom, 0);
    padding-left: 10px;
    padding-right: 10px;
  }
  nav.bottom button {
    flex: 1;
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 16px 4px 18px;
    min-height: 54px;
    cursor: pointer;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }
  nav.bottom button.active { color: #FFFFFF; font-weight: 700; }

  /* ---------- MODAL ---------- */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(10,14,26,0.6);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
  }
  .modal-overlay.hidden { display: none; }

  .modal {
    background: var(--paper);
    color: var(--ink-text);
    width: 100%;
    max-width: 560px;
    max-height: 88vh;
    overflow-y: auto;
    border-radius: 20px 20px 0 0;
    padding: 22px 20px 28px;
  }

  .modal h2 {
    font-family: 'Fraunces', serif;
    font-size: 21px;
    margin: 0 0 16px;
  }

  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #8a8168;
    margin-bottom: 5px;
  }
  .field input[type=text],
  .field input[type=number],
  .field input[type=date],
  .field textarea,
  .field select {
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
    display: block;
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    padding: 10px 11px;
    border-radius: 9px;
    border: 1px solid #ddd3b8;
    background: #fffdf8;
    color: var(--ink-text);
  }
  .field input[type=date] {
    -webkit-appearance: none;
    appearance: none;
    min-width: 0;
  }
  .field textarea { resize: vertical; min-height: 60px; }

  .cat-picker, .who-picker {
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .cat-opt, .who-opt {
    font-size: 12.5px;
    padding: 7px 12px;
    border-radius: 999px;
    border: 1px solid #ddd3b8;
    background: #fffdf8;
    cursor: pointer;
  }
  .cat-opt.selected, .who-opt.selected {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  .heart-picker { display: flex; gap: 6px; }
  .heart-picker .hp {
    width: 26px; height: 26px;
    cursor: pointer;
    opacity: 0.35;
  }
  .heart-picker .hp.active { opacity: 1; }

  .modal-actions {
    display: flex; gap: 10px; margin-top: 18px;
  }

  /* ---------- WELCOME (ventana emergente al abrir) ---------- */
  .modal-overlay.centered {
    align-items: center;
    padding: 16px;
  }
  .modal-overlay.centered .modal {
    width: 85%;
    max-width: 476px;
    border-radius: 20px;
    padding: 18px 17px 22px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    animation: popIn .35s cubic-bezier(.2,.9,.3,1.2);
  }
  .modal-overlay.centered .welcome-photo { height: 48vh; }
  .modal-overlay.centered .welcome-msg { font-size: 17px; }
  @keyframes popIn {
    from { transform: scale(.85); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modal-overlay.centered .modal { animation: none; }
  }
  .welcome-photo {
    width: 100%;
    height: 56vh;
    object-fit: cover;
    border-radius: 14px;
    display: block;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
  }
  h1.title {
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .msg-help { font-size: 13px; color: var(--text-soft); margin: -8px 0 16px; line-height: 1.45; }
  .msg-form {
    background: #fffdf8;
    border: 1px solid #ddd3b8;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 18px;
    text-align: left;
  }
  .msg-form textarea {
    width: 100%; box-sizing: border-box;
    font-family: 'Inter', sans-serif; font-size: 14.5px;
    padding: 10px 11px; border-radius: 9px;
    border: 1px solid #ddd3b8; background: #fff;
    min-height: 70px; resize: vertical; margin-top: 10px;
  }
  #msg-preview { width: 100%; max-height: 220px; object-fit: cover; border-radius: 10px; margin-top: 10px; display: none; }
  .msg-list { text-align: left; margin-bottom: 16px; }
  .msg-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 0; border-bottom: 1px solid #ecd9d6;
  }
  .msg-row img { width: 52px; height: 52px; border-radius: 9px; object-fit: cover; flex-shrink: 0; }
  .msg-row p { flex: 1; margin: 0; font-size: 13.5px; line-height: 1.35; }
  .msg-row .today { font-size: 11px; font-weight: 600; color: var(--coral); display: block; margin-bottom: 2px; }
  .msg-row button {
    background: none; border: none; color: var(--coral);
    font-size: 13px; padding: 8px; cursor: pointer;
  }
  .msg-toggle {
    display: flex; align-items: center; gap: 10px;
    text-align: left; font-size: 13.5px; margin-bottom: 14px;
  }
  .msg-toggle input { width: 20px; height: 20px; accent-color: var(--coral); }
  .welcome-msg {
    font-family: 'Fraunces', serif;
    font-size: 19px;
    font-weight: 600;
    line-height: 1.4;
    color: var(--coral);
    text-align: center;
    margin: 0 0 20px;
  }
  .btn {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  .btn.primary { background: var(--ink); color: var(--paper); }
  .btn.secondary { background: transparent; color: var(--ink-text); border: 1px solid #ddd3b8; }
  .btn.danger { background: var(--coral); color: #fff; }
  .btn.done { background: var(--gold); color: var(--ink); }

  .rating-picker { display: flex; gap: 8px; }
  .rating-picker .rp {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid #ddd3b8;
    background: #fffdf8;
    cursor: pointer;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
  }
  .rating-picker .rp.selected { background: var(--coral); color: #fff; border-color: var(--coral); }

  .banner {
    font-size: 12.5px;
    padding: 10px 12px;
    border-radius: 9px;
    margin-bottom: 14px;
  }
  .banner.error { background: rgba(184,92,74,0.15); color: var(--coral); border: 1px solid var(--coral); }
  .banner.info { background: rgba(124,139,111,0.15); color: var(--sage); border: 1px solid var(--sage); }

  .loading-dots { text-align: center; padding: 40px 0; color: var(--text-soft); font-family: 'IBM Plex Mono', monospace; font-size: 12px; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--ink-line); border-radius: 3px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>

const state = {

  marcador: [],
  mensajes: [],
  loading: true,
  error: null,
  view: "planes",       // planes | calendario | realizados | ranking
  filter: "todos",       // todos | idea | programado

  calMonth: new Date().getMonth(),

  marcadorLast: { juego: "Uno", lugar: "" }
};

const JUEGOS_COMUNES = ["Uno", "Jenga", "Cartas", "Parqués", "Otro"];

/* ============================================================
   API
   ============================================================ */
async function apiGet() {
  const res = await fetch(CONFIG.API_URL);
  if (!res.ok) throw new Error("No se pudo conectar con la hoja de cálculo.");
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return { planes: data.planes || [], marcador: data.marcador || [], mensajes: data.mensajes || [] };
}

async function apiSend(action, payload) {
  const body = Object.assign({ action }, payload);
  const res = await fetch(CONFIG.API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(body)
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

async function loadPlanes() {
  state.loading = true; state.error = null; render();
  try {
    const data = await apiGet();
    state.planes = data.planes;
    state.marcador = data.marcador;
    state.mensajes = data.mensajes;
  } catch (err) {
    state.error = err.message || String(err);
  }
  state.loading = false;
  render();
}

function heartsSvg(count, active) {
  let s = "";
  for (let i = 1; i <= 5; i++) {
    s += `<svg class="heart" viewBox="0 0 24 24" fill="${i <= count ? "#D2413D" : "#F8B4B2"}"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
  }
  return s;
}

function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString("es-CO", { day: "2-digit", month: "short", year: "numeric" });
}

/* ---- helpers de fecha local (evitan que el día se corra por zona horaria) ---- */
function parseLocalDate(str) {
  if (!str) return null;
  const parts = String(str).slice(0, 10).split("-");
  if (parts.length !== 3) return null;
  const y = Number(parts[0]), m = Number(parts[1]), d = Number(parts[2]);
  if (!y || !m || !d) return null;
  return new Date(y, m - 1, d);
}

function toISODateLocal(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

function monthDaysGrid(year, month) {
  const first = new Date(year, month, 1);
  const startOffset = (first.getDay() + 6) % 7; // lunes = 0
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startOffset; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(new Date(year, month, d));
  while (cells.length % 7 !== 0) cells.push(null);
  return cells;
}

function plansForDate(dateObj) {
  const y = dateObj.getFullYear(), m = dateObj.getMonth(), d = dateObj.getDate();
  return state.planes.filter(p => {
    const raw = p.estado === "realizado" ? p.fechaReal : p.fechaTentativa;
    const pd = parseLocalDate(raw);
    if (!pd) return false;
    return pd.getFullYear() === y && pd.getMonth() === m && pd.getDate() === d;
  });
}

function stampSvg(rating) {
  const dots = Array.from({ length: 5 }, (_, i) =>
    `<circle cx="${18 + i * 9}" cy="46" r="3" fill="${i < rating ? '#B23A34' : 'none'}" stroke="#B23A34" stroke-width="1.2"/>`
  ).join("");
  return `
  <svg class="stamp-wrap" width="72" height="72" viewBox="0 0 72 72">
    <circle cx="36" cy="36" r="30" fill="none" stroke="#B23A34" stroke-width="2.4" opacity="0.85"/>
    <circle cx="36" cy="36" r="24" fill="none" stroke="#B23A34" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>
    <text x="36" y="26" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="8" fill="#B23A34" opacity="0.9">SELLADO</text>
    ${dots}
  </svg>`;
}

function daysCount() {
  const year = new Date().getFullYear();
  return state.planes.filter(p => p.estado === "realizado" && p.fechaReal && new Date(p.fechaReal).getFullYear() === year).length;
}

/* ============================================================
   RENDER — layout general
   ============================================================ */
function render() {
  renderStats();
  renderScorePill();
  renderTabs();
  renderFilterChips();
  renderContent();
  renderBottomNav();
  renderModal();
}

function scoreTally() {
  const tally = {};
  CONFIG.NOMBRES.forEach(n => { tally[n] = 0; });
  state.marcador.forEach(m => {
    if (tally[m.ganador] !== undefined) tally[m.ganador]++;
  });
  return tally;
}

function renderScorePill() {
  const btn = document.getElementById("btn-marcador");
  const tally = scoreTally();
  const [n1, n2] = CONFIG.NOMBRES;
  btn.innerHTML = `
    <span class="sp-avatar"><img src="${avatarSrcFor(n1)}" alt="${n1}"></span>
    <span class="sp-name">${n1}</span>
    <span class="sp-num">${tally[n1] || 0}</span>
    <span class="sp-vs">VS</span>
    <span class="sp-num">${tally[n2] || 0}</span>
    <span class="sp-name">${n2}</span>
    <span class="sp-avatar"><img src="${avatarSrcFor(n2)}" alt="${n2}"></span>
  `;
  btn.onclick = openMarcador;
}

function renderStats() {
  const realizados = state.planes.filter(p => p.estado === "realizado").length;
  const ideas = state.planes.filter(p => p.estado === "idea").length;
  const promedio = (() => {
    const rated = state.planes.filter(p => p.estado === "realizado" && p.calificacion);
    if (!rated.length) return "—";
    return (rated.reduce((s, p) => s + Number(p.calificacion), 0) / rated.length).toFixed(1);
  })();
  document.getElementById("stat-row").innerHTML = `
    <div class="stat-pill"><span class="num">${realizados}</span><span class="lbl">Sellados ${new Date().getFullYear()}</span></div>
    <div class="stat-pill"><span class="num">${ideas}</span><span class="lbl">Ideas pendientes</span></div>
    <div class="stat-pill"><span class="num">${promedio}</span><span class="lbl">Calificación media</span></div>
  `;
}

function renderTabs() {
  const tabs = [
    { id: "planes", label: "Planes" },
    { id: "calendario", label: "Calendario" },
    { id: "realizados", label: "Realizados" },
    { id: "ranking", label: "Ranking" }
  ];
  document.getElementById("tabs").innerHTML = tabs.map(t =>
    `<button class="tab-btn ${state.view === t.id ? "active" : ""}" data-tab="${t.id}">${t.label}</button>`
  ).join("");
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.onclick = () => { state.view = btn.dataset.tab; state.filter = "todos"; render(); };
  });
}

function renderFilterChips() {
  const el = document.getElementById("filter-chips");
  if (state.view !== "planes") { el.innerHTML = ""; return; }
  const chips = [
    { id: "todos", label: "Todos" },
    { id: "idea", label: "Ideas" },
    { id: "programado", label: "Programados" }
  ];
  el.innerHTML = chips.map(c =>
    `<button class="chip ${state.filter === c.id ? "active" : ""}" data-chip="${c.id}">${c.label}</button>`
  ).join("");
  el.querySelectorAll(".chip").forEach(btn => {
    btn.onclick = () => { state.filter = btn.dataset.chip; render(); };
  });
}

function renderBottomNav() {
  const items = [
    { id: "planes", label: "Planes" },
    { id: "calendario", label: "Calendario" },
    { id: "realizados", label: "Realizados" },
    { id: "ranking", label: "Ranking" }
  ];
  document.getElementById("bottom-nav").innerHTML = items.map(i =>
    `<button class="${state.view === i.id ? "active" : ""}" data-nav="${i.id}">${i.label}</button>`
  ).join("");
  document.querySelectorAll("[data-nav]").forEach(btn => {
    btn.onclick = () => { state.view = btn.dataset.nav; state.filter = "todos"; render(); };
  });
}

/* ============================================================
   RENDER — contenido según vista
   ============================================================ */
function renderContent() {
  const el = document.getElementById("content");

  if (state.loading) {
    el.innerHTML = `<div class="loading-dots">Abriendo la bitácora…</div>`;
    return;
  }
  if (state.error) {
    el.innerHTML = `<div class="banner error">${state.error}<br><br>Revisa que CONFIG.API_URL en el archivo tenga la URL correcta de tu Apps Script desplegado como "Cualquier usuario".</div>`;
    return;
  }

  if (state.view === "planes") return renderPlanesView(el);
  if (state.view === "calendario") return renderCalendarView(el);
  if (state.view === "realizados") return renderRealizadosView(el);
  if (state.view === "ranking") return renderRankingView(el);
}

function renderPlanesView(el) {
  let list = state.planes.filter(p => p.estado === "idea" || p.estado === "programado");
  if (state.filter !== "todos") list = list.filter(p => p.estado === state.filter);
  list.sort((a, b) => {
    if (a.fechaTentativa && b.fechaTentativa) return new Date(a.fechaTentativa) - new Date(b.fechaTentativa);
    if (a.fechaTentativa) return -1;
    if (b.fechaTentativa) return 1;
    return Number(b.prioridad || 0) - Number(a.prioridad || 0);
  });

  if (!list.length) {
    el.innerHTML = emptyState("Página en blanco", "Aún no hay planes aquí. Toca el + y escriban la primera idea.");
    return;
  }

  el.innerHTML = list.map(planCard).join("");
  attachCardHandlers(el);
}

function renderCalendarView(el) {
  const y = state.calYear, m = state.calMonth;
  const cells = monthDaysGrid(y, m);
  const monthLabel = new Date(y, m, 1).toLocaleDateString("es-CO", { month: "long", year: "numeric" });
  const today = new Date();
  const weekdays = ["L", "M", "X", "J", "V", "S", "D"];

  el.innerHTML = `
    <div class="cal-card">
      <div class="cal-header">
        <button class="cal-nav-btn" id="cal-prev" aria-label="Mes anterior">‹</button>
        <span class="cal-month-label">${monthLabel}</span>
        <button class="cal-nav-btn" id="cal-next" aria-label="Mes siguiente">›</button>
      </div>
      <div class="cal-grid">
        ${weekdays.map(w => `<div class="cal-weekday">${w}</div>`).join("")}
        ${cells.map(d => {
          if (!d) return `<div class="cal-day empty"></div>`;
          const plans = plansForDate(d);
          const isToday = d.toDateString() === today.toDateString();
          const dots = plans.slice(0, 4).map(p =>
            `<span class="cal-dot" style="background:${catInfo(p.categoria).color}"></span>`
          ).join("");
          return `<div class="cal-day ${isToday ? "today" : ""} ${plans.length ? "has-plans" : ""}" data-date="${toISODateLocal(d)}">
            <span>${d.getDate()}</span>
            <span class="cal-dots">${dots}</span>
          </div>`;
        }).join("")}
      </div>
    </div>
  `;

  document.getElementById("cal-prev").onclick = () => shiftMonth(-1);
  document.getElementById("cal-next").onclick = () => shiftMonth(1);
  el.querySelectorAll(".cal-day[data-date]").forEach(cell => {
    cell.onclick = () => openDay(parseLocalDate(cell.dataset.date));
  });
}

function shiftMonth(delta) {
  let m = state.calMonth + delta;
  let y = state.calYear;
  if (m < 0) { m = 11; y -= 1; }
  if (m > 11) { m = 0; y += 1; }
  state.calMonth = m;
  state.calYear = y;
  render();
}

function renderRealizadosView(el) {
  const list = state.planes
    .filter(p => p.estado === "realizado")
    .sort((a, b) => new Date(b.fechaReal || 0) - new Date(a.fechaReal || 0));

  if (!list.length) {
    el.innerHTML = emptyState("Sin sellos todavía", "Cuando cumplan un plan y lo marquen como realizado, aparecerá aquí con su sello.");
    return;
  }
  el.innerHTML = list.map(planCard).join("");
  attachCardHandlers(el);
}

function renderRankingView(el) {
  const list = state.planes
    .filter(p => p.estado === "realizado" && p.calificacion)
    .sort((a, b) => Number(b.calificacion) - Number(a.calificacion));

  if (!list.length) {
    el.innerHTML = emptyState("Todavía sin ranking", "Califica los planes realizados para armar el top de favoritos.");
    return;
  }
  el.innerHTML = list.map((p, i) => {
    const c = catInfo(p.categoria);
    return `
    <div class="rank-row" data-id="${p.id}">
      <div class="rank-num">${String(i + 1).padStart(2, "0")}</div>
      <div class="rank-info">
        <h4>${escapeHtml(p.titulo)}</h4>
        <span class="cat-tag" style="background:${c.color}">${c.label}</span>
      </div>
      <div class="rating-dots">${ratingDots(p.calificacion)}</div>
    </div>`;
  }).join("");
  el.querySelectorAll(".rank-row").forEach(row => {
    row.onclick = () => openDetail(row.dataset.id);
  });
}

function emptyState(big, small) {
  return `<div class="empty-state"><p class="eyebrow">···</p><p class="big">${big}</p><p>${small}</p></div>`;
}

function ratingDots(rating) {
  return Array.from({ length: 5 }, (_, i) =>
    `<span class="dot ${i < rating ? "filled" : ""}"></span>`
  ).join("");
}

function planCard(p) {
  const c = catInfo(p.categoria);
  const isDone = p.estado === "realizado";
  return `
  <div class="card" style="--cat-color:${c.color}" data-id="${p.id}">
    ${isDone && p.fotoUrl ? `<div class="card-photo" style="background-image:url('${p.fotoUrl}')"></div>` : ""}
    ${isDone ? stampSvg(Number(p.calificacion) || 0) : ""}
    <div class="card-top">
      <div>
        <h3>${escapeHtml(p.titulo)}</h3>
      </div>
    </div>
    ${p.descripcion ? `<p class="desc">${escapeHtml(p.descripcion)}</p>` : ""}
    <div class="card-meta">
      ${avatarBadge(p.propuestoPor)}
      <span class="cat-tag" style="background:${c.color}">${c.label}</span>
      ${p.fechaTentativa ? `<span class="meta-date">${fmtDate(p.fechaTentativa)}</span>` : ""}
      ${!isDone ? `<span class="hearts">${heartsSvg(Number(p.prioridad) || 0)}</span>` : ""}
      ${!isDone ? `<span class="status-badge status-${p.estado}">${p.estado}</span>` : ""}
    </div>
    ${isDone ? `<div class="rating-dots">${ratingDots(p.calificacion)}</div>` : ""}
  </div>`;
}

function attachCardHandlers(el) {
  el.querySelectorAll(".card").forEach(card => {
    card.onclick = () => openDetail(card.dataset.id);
  });
}

function escapeHtml(str) {
  if (!str) return "";
  return String(str).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}

/* ============================================================
   MODAL — nuevo / editar / detalle
   ============================================================ */
function openNew() {
  state.draft = {
    titulo: "", descripcion: "", categoria: "aventura", prioridad: 3,
    costoEstimado: "", fechaTentativa: "", estado: "idea", propuestoPor: CONFIG.NOMBRES[0]
  };
  state.modal = { mode: "new" };
  render();
}

function openDetail(id) {
  const plan = state.planes.find(p => String(p.id) === String(id));
  if (!plan) return;
  state.draft = Object.assign({}, plan);
  state.modal = { mode: "detail" };
  render();
}

function closeModal() {
  state.modal = null;
  state.draft = null;
  render();
}

function syncFormFields() {
  const t = document.getElementById("f-titulo");
  const d = document.getElementById("f-descripcion");
  const f = document.getElementById("f-fecha");
  const c = document.getElementById("f-costo");
  if (t) state.draft.titulo = t.value;
  if (d) state.draft.descripcion = d.value;
  if (f) state.draft.fechaTentativa = f.value;
  if (c) state.draft.costoEstimado = c.value;
}

function openWelcome() {
  state.draft = null;
  state.modal = { mode: "welcome" };
  render();
}

function openSurprise() {
  const candidatos = state.planes.filter(p => p.estado === "idea" || p.estado === "programado");
  if (!candidatos.length) {
    alert("Todavía no hay ideas guardadas. Agreguen la primera con el botón +.");
    return;
  }
  const elegido = candidatos[Math.floor(Math.random() * candidatos.length)];
  state.draft = null;
  state.modal = { mode: "surprise", loading: true };
  render();
  runSurpriseSpin(candidatos, elegido);
}

function runSurpriseSpin(candidatos, elegido) {
  const totalMs = 3000;
  const tickMs = 130;
  let elapsed = 0;
  const timer = setInterval(() => {
    // si el modal se cerró o cambió mientras giraba, cancelar limpio
    if (!state.modal || state.modal.mode !== "surprise" || !state.modal.loading) {
      clearInterval(timer);
      return;
    }
    elapsed += tickMs;
    const preview = candidatos[Math.floor(Math.random() * candidatos.length)];
    const label = document.getElementById("surprise-spin-title");
    if (label) label.textContent = preview.titulo;

    if (elapsed >= totalMs) {
      clearInterval(timer);
      state.draft = Object.assign({}, elegido);
      state.modal = { mode: "surprise", loading: false };
      render();
    }
  }, tickMs);
}

function openMarcador() {
  state.marcadorAdding = null;
  state.modal = { mode: "marcador" };
  render();
}

function openDay(dateObj) {
  state.dayDate = dateObj;
  state.modal = { mode: "day" };
  render();
}

function openNewForDate(dateObj) {
  state.draft = {
    titulo: "", descripcion: "", categoria: "aventura", prioridad: 3,
    costoEstimado: "", fechaTentativa: toISODateLocal(dateObj), estado: "programado",
    propuestoPor: CONFIG.NOMBRES[0]
  };
  state.modal = { mode: "new" };
  render();
}

function renderModal() {
  const overlay = document.getElementById("modal-overlay");
  const body = document.getElementById("modal-body");
  if (!state.modal) { overlay.classList.add("hidden"); body.innerHTML = ""; return; }
  overlay.classList.remove("hidden");
  overlay.classList.toggle("centered", state.modal.mode === "welcome");

  if (state.modal.mode === "new") body.innerHTML = formTemplate("Nuevo plan");
  else if (state.modal.mode === "edit") body.innerHTML = formTemplate("Editar plan");
  else if (state.modal.mode === "welcome") body.innerHTML = welcomeTemplate();
  else if (state.modal.mode === "mensajes") body.innerHTML = mensajesTemplate();
  else if (state.modal.mode === "surprise") body.innerHTML = surpriseTemplate();
  else if (state.modal.mode === "day") body.innerHTML = dayTemplate();
  else if (state.modal.mode === "marcador") body.innerHTML = marcadorTemplate();
  else body.innerHTML = detailTemplate();

  wireModal();
}

/* ---------- Mensajes de bienvenida ---------- */
// Se usa solo si todavía no hay mensajes guardados en la hoja "Mensajes".
const WELCOME_DEFAULT = {
  fotoUrl: "foto-bienvenida.jpg?v=2",
  frase: "No importa cuando leas esto Lau: Te quiero, te elijo y te respeto."
};
const HIDE_WELCOME_KEY = "bitacora_ocultarBienvenida";

function mensajesOrdenados() {
  return (state.mensajes || [])
    .filter(m => m.fotoUrl)
    .slice()
    .sort((a, b) => String(a.fechaCreacion).localeCompare(String(b.fechaCreacion)));
}

// Un mensaje distinto cada día: cambia a medianoche (hora del celular).
function mensajeDelDia() {
  const lista = mensajesOrdenados();
  if (!lista.length) return WELCOME_DEFAULT;
  const hoy = new Date();
  const dia = Math.floor(new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate()).getTime() / 86400000);
  return lista[dia % lista.length];
}

function welcomeOculta() {
  try { return localStorage.getItem(HIDE_WELCOME_KEY) === "1"; } catch (e) { return false; }
}
function setWelcomeOculta(v) {
  try { v ? localStorage.setItem(HIDE_WELCOME_KEY, "1") : localStorage.removeItem(HIDE_WELCOME_KEY); } catch (e) {}
}

function welcomeTemplate() {
  const m = mensajeDelDia();

// Reduce la foto a máx. 1280 px y JPEG para que suba rápido.
function compressImage(file, maxSide = 1280, quality = 0.85) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", quality).split(",")[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("No se pudo leer la foto.")); };
    img.src = url;
  });
}

function backendDesactualizado(err) {
  return /Acción desconocida/i.test(String(err && err.message));
}

async function saveMensaje() {
  const fileInput = document.getElementById("msg-foto");
  const file = fileInput && fileInput.files[0];
  const frase = document.getElementById("msg-frase").value.trim();
  if (!file) { alert("Elige una foto primero."); return; }
  const btn = document.getElementById("btn-msg-save");
  btn.disabled = true;
  try {
    btn.textContent = "Subiendo foto…";
    const base64 = await compressImage(file);
    const up = await apiSend("uploadPhoto", { fileData: base64, fileName: "mensaje_" + Date.now() + ".jpg", mimeType: "image/jpeg" });
    btn.textContent = "Guardando…";
    await apiSend("addMensaje", { mensaje: { fotoUrl: up.url, frase } });
    await loadPlanes();
    state.modal = { mode: "mensajes" };
    render();
  } catch (err) {
    alert(backendDesactualizado(err)
      ? "Falta actualizar el código del backend en Apps Script (pestaña Mensajes). Sigue los pasos que te dejé y vuelve a intentar."
      : "No se pudo guardar: " + err.message);
    btn.disabled = false;
    btn.textContent = "Guardar mensaje";
  }
}

async function deleteMensaje(id) {
  if (!confirm("¿Borrar este mensaje?")) return;
  try {
    await apiSend("deleteMensaje", { id });
    await loadPlanes();
    state.modal = { mode: "mensajes" };
    render();
  } catch (err) {
    alert("No se pudo borrar: " + err.message);
  }
}

function openMensajes() {
  state.draft = null;
  state.modal = { mode: "mensajes" };
  render();
}

function wireLongPress(el, ms, fn) {
  let t = null;
  const start = () => { clearTimeout(t); t = setTimeout(() => { t = null; fn(); }, ms); };
  const cancel = () => { clearTimeout(t); t = null; };
  el.addEventListener("pointerdown", start);
  ["pointerup", "pointerleave", "pointercancel"].forEach(ev => el.addEventListener(ev, cancel));
  el.addEventListener("contextmenu", e => e.preventDefault());
}

function surpriseTemplate() {
  if (state.modal.loading) {
    return `
      <div class="surprise-loading">
        <div class="surprise-spinner">
          <span>✦</span><span>✧</span><span>✦</span><span>✧</span>
        </div>
        <p class="eyebrow" style="color:#8a8168;">Girando la ruleta de planes…</p>
        <p id="surprise-spin-title" class="surprise-spin-title">…</p>
      </div>
    `;
  }
  const d = state.draft;
  const c = catInfo(d.categoria);
  return `
    <p class="eyebrow" style="color:#8a8168;">✦ La bitácora eligió por ustedes</p>
    <h2>${escapeHtml(d.titulo)}</h2>
    ${d.descripcion ? `<p class="desc" style="font-size:14px;">${escapeHtml(d.descripcion)}</p>` : ""}
    <div class="field">
      ${avatarBadge(d.propuestoPor)}
      <span class="cat-tag" style="background:${c.color}">${c.label}</span>
      <span class="hearts" style="display:inline-flex;vertical-align:middle;margin-left:8px;">${heartsSvg(Number(d.prioridad)||0)}</span>
    </div>
    <div class="modal-actions">
      <button class="btn secondary" id="btn-surprise-again">Otra idea</button>
      <button class="btn done" id="btn-surprise-schedule">Programar esta</button>
    </div>
    <button class="btn secondary" id="btn-surprise-close" style="margin-top:10px;width:100%;">Cerrar</button>
  `;
}

function detailTemplate() {
  const d = state.draft;
  const c = catInfo(d.categoria);
  const isDone = d.estado === "realizado";
  return `
    <h2>${escapeHtml(d.titulo)}</h2>
    ${isDone && d.fotoUrl ? `<img class="detail-photo" src="${d.fotoUrl}" alt="Foto del plan realizado">` : ""}
    <div class="field">
      ${avatarBadge(d.propuestoPor)}
      <span class="cat-tag" style="background:${c.color}">${c.label}</span>
      ${!isDone ? `<span class="hearts" style="display:inline-flex;vertical-align:middle;margin-left:8px;">${heartsSvg(Number(d.prioridad)||0)}</span>` : ""}
    </div>
    ${d.descripcion ? `<p class="desc" style="font-size:14px;">${escapeHtml(d.descripcion)}</p>` : ""}
    <div class="field">
      <label>Fecha ${isDone ? "en que se hizo" : "tentativa"}</label>
      <p style="margin:0;font-family:'IBM Plex Mono',monospace;font-size:13px;">${fmtDate(isDone ? d.fechaReal : d.fechaTentativa) || "Sin definir"}</p>
    </div>
    ${d.costoEstimado ? `<div class="field"><label>Costo estimado</label><p style="margin:0;">$${d.costoEstimado}</p></div>` : ""}
    ${d.propuestoPor ? `<div class="field"><label>Propuesto por</label><p style="margin:0;">${escapeHtml(d.propuestoPor)}</p></div>` : ""}

    ${isDone ? `
    <div class="field">
      <label>Calificación</label>
      <div class="rating-dots">${ratingDots(d.calificacion)}</div>
    </div>
    ${d.nota ? `<div class="field"><label>Nota</label><p style="margin:0;">${escapeHtml(d.nota)}</p></div>` : ""}
    ` : `
    <div class="field">
      <label>Marcar como realizado</label>
      <input type="date" id="f-fecha-real" value="${new Date().toISOString().slice(0,10)}">
      <div class="rating-picker" style="margin-top:8px;" id="f-rating">
        ${[1,2,3,4,5].map(n => `<button class="rp" data-rp="${n}">${n}</button>`).join("")}
      </div>
      <textarea id="f-nota" placeholder="¿Cómo estuvo?" style="margin-top:8px;width:100%;font-family:'Inter',sans-serif;font-size:14px;padding:9px;border-radius:9px;border:1px solid #ddd3b8;background:#fffdf8;"></textarea>
      <div class="photo-input-wrap">
        <label class="upload-btn" for="f-foto">Agregar foto</label>
        <input type="file" id="f-foto" accept="image/*" style="display:none;">
        <img id="foto-preview-img" alt="Vista previa">
      </div>
    </div>
    `}

    <div class="modal-actions">
      <button class="btn secondary" id="btn-close">Cerrar</button>
      ${!isDone ? `<button class="btn secondary" id="btn-edit">Editar</button>` : ""}
      ${!isDone ? `<button class="btn done" id="btn-mark-done">Sellar plan</button>` : ""}
    </div>
    ${!isDone ? `<button class="btn danger" id="btn-delete" style="margin-top:10px;width:100%;">Eliminar plan</button>` : ""}
  `;
}

function wireModal() {
  const overlay = document.getElementById("modal-overlay");
  overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };

  if (state.modal.mode === "mensajes") {
    document.getElementById("btn-msg-close").onclick = closeModal;
    document.getElementById("btn-msg-save").onclick = saveMensaje;
    document.getElementById("msg-hide").onchange = (e) => setWelcomeOculta(e.target.checked);
    const fi = document.getElementById("msg-foto");
    fi.onchange = () => {
      const f = fi.files[0];
      const pv = document.getElementById("msg-preview");
      if (f) { pv.src = URL.createObjectURL(f); pv.style.display = "block"; }
    };
    document.querySelectorAll("[data-del-msg]").forEach(b => {
      b.onclick = () => deleteMensaje(b.dataset.delMsg);
    });
    return;
  }

  if (state.modal.mode === "welcome") {
    document.getElementById("btn-welcome-close").onclick = closeModal;
    return;
  }

  if (state.modal.mode === "day") {
    document.getElementById("btn-day-close").onclick = closeModal;
    document.getElementById("btn-day-new").onclick = () => openNewForDate(state.dayDate);
    document.querySelectorAll(".day-plan-row").forEach(row => {
      row.onclick = () => openDetail(row.dataset.id);
    });
    return;
  }

  if (state.modal.mode === "marcador") {
    const closeBtn = document.getElementById("btn-score-close");
    if (closeBtn) closeBtn.onclick = closeModal;

    const [n1, n2] = CONFIG.NOMBRES;
    const addN1 = document.getElementById("btn-add-n1");
    const addN2 = document.getElementById("btn-add-n2");
    if (addN1) addN1.onclick = () => { state.marcadorAdding = n1; render(); };
    if (addN2) addN2.onclick = () => { state.marcadorAdding = n2; render(); };

    document.querySelectorAll("[data-juego]").forEach(el => {
      el.onclick = () => {
        const lugarEl = document.getElementById("sh-lugar");
        if (lugarEl) state.marcadorLast.lugar = lugarEl.value;
        state.marcadorLast.juego = el.dataset.juego;
        render();
      };
    });

    const cancelBtn = document.getElementById("btn-score-cancel");
    if (cancelBtn) cancelBtn.onclick = () => { state.marcadorAdding = null; render(); };

    const saveBtn = document.getElementById("btn-score-save");
    if (saveBtn) saveBtn.onclick = saveMarcadorEntry;

    document.querySelectorAll("[data-del]").forEach(btn => {
      btn.onclick = (e) => { e.stopPropagation(); removeMarcadorEntry(btn.dataset.del); };
    });
    return;
  }

  if (state.modal.mode === "surprise") {
    if (state.modal.loading) return; // nada que conectar mientras gira la ruleta
    document.getElementById("btn-surprise-close").onclick = closeModal;
    document.getElementById("btn-surprise-again").onclick = openSurprise;
    document.getElementById("btn-surprise-schedule").onclick = () => {
      state.modal = { mode: "edit" };
      render();
    };
    return;
  }

  if (state.modal.mode === "new" || state.modal.mode === "edit") {
    document.getElementById("btn-cancel").onclick = closeModal;

    // Guarda cada campo de texto en el estado apenas se escribe, para que
    // nunca se pierda nada sin importar qué botón se toque después.
    const tEl = document.getElementById("f-titulo");
    const dEl = document.getElementById("f-descripcion");
    const fEl = document.getElementById("f-fecha");
    const cEl = document.getElementById("f-costo");
    if (tEl) tEl.oninput = () => { state.draft.titulo = tEl.value; };
    if (dEl) dEl.oninput = () => { state.draft.descripcion = dEl.value; };
    if (fEl) fEl.oninput = () => { state.draft.fechaTentativa = fEl.value; };
    if (cEl) cEl.oninput = () => { state.draft.costoEstimado = cEl.value; };

    document.querySelectorAll("[data-cat]").forEach(el => {
      el.onclick = () => { syncFormFields(); state.draft.categoria = el.dataset.cat; render(); };
    });
    document.querySelectorAll("[data-heart]").forEach(el => {
      el.onclick = () => { syncFormFields(); state.draft.prioridad = Number(el.dataset.heart); render(); };
    });
    document.querySelectorAll("[data-who]").forEach(el => {
      el.onclick = () => { syncFormFields(); state.draft.propuestoPor = el.dataset.who; render(); };
    });
    document.getElementById("btn-save").onclick = saveDraft;
    return;
  }

  // detail mode
  document.getElementById("btn-close").onclick = closeModal;
  const editBtn = document.getElementById("btn-edit");
  if (editBtn) editBtn.onclick = () => { state.modal.mode = "edit"; render(); };
  const delBtn = document.getElementById("btn-delete");
  if (delBtn) delBtn.onclick = removeDraft;
  const rpButtons = document.querySelectorAll("[data-rp]");
  if (rpButtons.length) {
    rpButtons.forEach(el => {
      el.onclick = () => {
        state._pendingRating = Number(el.dataset.rp);
        rpButtons.forEach(b => b.classList.toggle("selected", Number(b.dataset.rp) === state._pendingRating));
      };
    });
  }
  const doneBtn = document.getElementById("btn-mark-done");
  if (doneBtn) doneBtn.onclick = markDone;

  const fotoInput = document.getElementById("f-foto");
  if (fotoInput) {
    fotoInput.onchange = () => {
      const file = fotoInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const img = document.getElementById("foto-preview-img");
        img.src = reader.result;
        img.style.display = "block";
      };
      reader.readAsDataURL(file);
    };
  }
}

async function saveMarcadorEntry() {
  const ganador = state.marcadorAdding;
  if (!ganador) return;
  const lugarEl = document.getElementById("sh-lugar");
  const lugar = lugarEl ? lugarEl.value.trim() : "";
  const juego = state.marcadorLast.juego || "Otro";
  state.marcadorLast = { juego, lugar };

  const btn = document.getElementById("btn-score-save");
  if (btn) { btn.textContent = "Guardando…"; btn.disabled = true; }

  try {
    await apiSend("addMarcador", { entry: { juego, ganador, fecha: toISODateLocal(new Date()), lugar, nota: "" } });
    state.marcadorAdding = null;
    await loadPlanes();
    state.modal = { mode: "marcador" };
    render();
  } catch (err) {
    alert("No se pudo guardar el punto: " + err.message);
    if (btn) { btn.textContent = "Guardar punto de " + ganador; btn.disabled = false; }
  }
}

async function removeMarcadorEntry(id) {
  if (!confirm("¿Eliminar este punto del historial?")) return;
  try {
    await apiSend("deleteMarcador", { id });
    await loadPlanes();
    state.modal = { mode: "marcador" };
    render();
  } catch (err) {
    alert("No se pudo eliminar: " + err.message);
  }
}

async function saveDraft() {
  const d = state.draft;
  d.titulo = document.getElementById("f-titulo").value.trim();
  d.descripcion = document.getElementById("f-descripcion").value.trim();
  d.fechaTentativa = document.getElementById("f-fecha").value;
  d.costoEstimado = document.getElementById("f-costo").value;
  if (!d.titulo) { alert("Ponle un título al plan."); return; }
  if (!d.estado) d.estado = "idea";
  if (d.fechaTentativa && d.estado === "idea") d.estado = "programado";

  try {
    if (d.id) await apiSend("update", { plan: d });
    else await apiSend("add", { plan: d });
    closeModal();
    await loadPlanes();
  } catch (err) {
    alert("No se pudo guardar: " + err.message);
  }
}

function readFileAsBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function uploadPhotoFile(file) {
  const base64 = await readFileAsBase64(file);
  const data = await apiSend("uploadPhoto", { fileData: base64, fileName: file.name, mimeType: file.type });
  return data.url;
}

async function markDone() {
  const d = state.draft;
  const rating = state._pendingRating;
  if (!rating) { alert("Selecciona una calificación de 1 a 5."); return; }
  const btn = document.getElementById("btn-mark-done");
  const fotoInput = document.getElementById("f-foto");
  const file = fotoInput && fotoInput.files[0];

  try {
    if (file) {
      btn.textContent = "Subiendo foto…";
      btn.disabled = true;
      d.fotoUrl = await uploadPhotoFile(file);
    }
    d.estado = "realizado";
    d.fechaReal = document.getElementById("f-fecha-real").value || new Date().toISOString().slice(0,10);
    d.calificacion = rating;
    d.nota = document.getElementById("f-nota").value.trim();
    await apiSend("update", { plan: d });
    closeModal();
    await loadPlanes();
  } catch (err) {
    alert("No se pudo guardar: " + err.message);
    if (btn) { btn.textContent = "Sellar plan"; btn.disabled = false; }
  }
}

async function removeDraft() {
  if (!confirm("¿Eliminar este plan?")) return;
  try {
    await apiSend("delete", { id: state.draft.id });
    closeModal();
    await loadPlanes();
  } catch (err) {
    alert("No se pudo eliminar: " + err.message);
  }
}

document.getElementById("fab-new").onclick = openNew;
document.getElementById("btn-surprise").onclick = openSurprise;
wireLongPress(document.querySelector("h1.title"), 800, openMensajes);
loadPlanes().then(() => {
  // Al entrar a la app, despliega la ventana de bienvenida (salvo que se haya ocultado en este celular)
  if (!welcomeOculta() && !state.modal) openWelcome();
});
